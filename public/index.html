<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Word Burn</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Burn">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1830">
<style>
:root{
  /* Layout: a night sky. One thing on screen at a time: the word. Rewards happen in the sky above it; misses drop to a shelf below. */
  --sky:#0d1830; --sky2:#1a2a52; --panel:#1f3160; --line:#34497c; --ink:#f2f5ff; --muted:#a3b3d6;
  --card:#fff7e3; --card-ink:#14233b; --fire:#ffb21e; --hot:#ff5a36; --cool:#35e0c2; --later:#b9a7ff;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);color:var(--ink);font:17px/1.4 "Avenir Next","Nunito","Trebuchet MS",system-ui,sans-serif;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
button:focus-visible{outline:3px solid var(--fire);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#app{position:relative;z-index:2;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));gap:14px}
.grow{flex:1;min-height:0}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px}
.icon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:20px;flex:none}

/* home */
.home{align-items:center;justify-content:center;text-align:center;gap:22px}
.logo{font-weight:900;font-size:56px;line-height:.95;letter-spacing:1px;text-transform:uppercase}
.logo b{display:block;color:var(--fire);text-shadow:0 0 24px rgba(255,140,30,.55)}
.flame{font-size:64px;line-height:1;filter:drop-shadow(0 0 18px rgba(255,120,30,.6));animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{50%{transform:scale(1.07) rotate(-2deg)}}
.tally{font-size:20px}
.tally b{font-size:44px;font-weight:900;color:var(--fire);display:block;line-height:1.05;font-variant-numeric:tabular-nums}
.play{background:var(--fire);color:#2a1500;font-weight:900;font-size:34px;padding:20px 64px;border-radius:999px;box-shadow:0 7px 0 #b96f00, 0 0 40px rgba(255,160,30,.35)}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 #b96f00}
.name{font-size:24px;font-weight:800;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.08)}
.name span{font-size:13px;font-weight:600;color:var(--muted)}
.names{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.pick{background:var(--fire);color:#2a1500;font-weight:900;font-size:28px;padding:16px;border-radius:22px;box-shadow:0 6px 0 #b96f00}
.newp{display:flex;gap:8px;width:100%;max-width:320px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);user-select:text;-webkit-user-select:text}
.fam{display:flex;flex-direction:column;gap:10px}
.code{font-size:30px;font-weight:900;letter-spacing:.12em;color:var(--fire);font-variant-numeric:tabular-nums}
.ver{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:var(--muted);opacity:.7}
.corner{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px}

/* the mountain */
.mtn{gap:10px}
.brand{font-weight:900;font-size:17px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap} .brand b{color:var(--fire)}
.mtn .name{font-size:18px;padding:6px 12px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtn-wrap{position:relative;flex:1;min-height:120px;display:flex;border-radius:22px;overflow:hidden;border:2px solid var(--line)}
.mtn-scroll{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;background:linear-gradient(180deg,#070d1f 0%,#13224a 100%)}
.mtn-scroll::-webkit-scrollbar{display:none}
.mtn-scroll svg{display:block;width:100%}
.mtn-scroll text{font-size:12px;font-weight:800;fill:var(--ink)}
.sign rect{fill:#14233b;stroke:var(--line);stroke-width:1.5} .sign.top rect{stroke:var(--fire)}
.st{fill:#6b7fb3} .st.on{fill:var(--fire)}
.tent{fill:#7d8cb5} .lit .tent{fill:var(--hot)}
.flame{fill:var(--fire);display:none;transform-box:fill-box;transform-origin:50% 100%} .lit .flame{display:inline;animation:flicker 1.2s ease-in-out infinite}
.halo{fill:#ffd35a;opacity:.2}
.gem{fill:var(--later);stroke:#fff;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:bob 1.6s ease-in-out infinite}
.gem.pop{animation:pop .45s ease-out forwards}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes pop{to{transform:translateY(-26px) scale(2);opacity:0}}
.mtn-map{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;background:rgba(13,24,48,.82);border-radius:14px;pointer-events:none;font-size:13px;font-weight:700;color:var(--ink)}
.mtn-map svg{width:44px;height:44px;flex:none} .mtn-map b{color:var(--fire);font-size:17px;font-weight:900;font-variant-numeric:tabular-nums}
.mtn-banner{position:absolute;left:0;right:0;top:22%;text-align:center;font-weight:900;font-size:40px;color:var(--fire);text-shadow:0 3px 0 #2a1500,0 0 24px rgba(255,140,30,.7);opacity:0;pointer-events:none}
.mtn-banner.go{animation:cheer 1.6s ease-out forwards}
@keyframes cheer{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.15)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles div{background:rgba(255,255,255,.08);border-radius:16px;padding:8px 6px;text-align:center}
.tiles b{display:block;font-size:32px;font-weight:900;line-height:1.1;color:var(--fire);font-variant-numeric:tabular-nums}
.tiles .sch b,.nums .sch b{color:var(--cool)}
.tiles span{font-size:13px;color:var(--muted)}
.pickup{text-align:center;font-weight:800;font-size:15px;color:var(--later)}
.mtn .play{font-size:28px;padding:14px 40px;align-self:center}
.mtn .row .play{align-self:auto}
.done{font-weight:900;font-size:22px;text-transform:uppercase} .done b{color:var(--fire)}
.nums{display:flex;flex-direction:column;align-items:flex-end;font-size:13px;color:var(--muted);line-height:1.25} .nums b{color:var(--fire);font-size:15px}
.mtn .trio{text-align:center} .mtn .trio div{padding:8px 4px} .mtn .trio span{font-size:12px;line-height:1.2;display:block} .mtn .trio b{font-size:24px}
.mtn .shelf{min-height:0}

/* play */
.dots{flex:1;display:flex;gap:4px}
.dots i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.14)}
.dots i.fast{background:var(--fire)} .dots i.slow{background:#c9702a} .dots i.miss{background:var(--later)}
.count{font-weight:900;font-size:22px;color:var(--fire);min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.combo{height:30px;text-align:center;font-weight:800;color:var(--fire);font-size:19px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.card{background:var(--card);color:var(--card-ink);border-radius:26px;min-height:210px;display:grid;place-items:center;padding:18px 12px;box-shadow:0 10px 0 rgba(0,0,0,.28);position:relative;transition:box-shadow .15s}
.card.fast{box-shadow:0 0 0 6px var(--fire),0 0 50px rgba(255,150,30,.7)}
.card.slow{box-shadow:0 0 0 6px #c9702a,0 10px 0 rgba(0,0,0,.28)}
.card.miss{box-shadow:0 0 0 6px var(--later),0 10px 0 rgba(0,0,0,.28)}
#word{font-weight:800;letter-spacing:.03em;white-space:nowrap;line-height:1.1;display:inline-block}
#word.dot{width:18px;height:18px;border-radius:50%;background:#cfc5a5}
#word.burn{animation:burn .55s ease-out forwards}
@keyframes burn{30%{transform:scale(1.25);color:#ff7a1a;text-shadow:0 0 22px #ffb21e}100%{transform:scale(1.6) translateY(-40px);opacity:0;color:#ffd35a}}
#word.warm{animation:warm .5s ease-out forwards}
@keyframes warm{40%{transform:scale(1.12);color:#0a8f7b}100%{transform:scale(1);opacity:.25}}
#word.drop{animation:drop .6s ease-in forwards}
#word.ember{animation:ember 1.4s ease-out forwards}
@keyframes ember{15%{color:#ff7a1a;text-shadow:0 0 14px #ffb21e}55%{color:#b9541a;text-shadow:0 0 6px #ff7a1a}100%{color:#8c7f6a;text-shadow:none;opacity:.45}}
@keyframes drop{20%{transform:rotate(-3deg)}100%{transform:translate(30%,170px) scale(.35);opacity:0}}
.say{min-height:50px;text-align:center;font-size:20px;font-weight:800}
.say span{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.say.fast{color:var(--fire)} .say.slow{color:#ffa35c} .say.miss{color:var(--later)}
.shelf{min-height:46px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shelf .lab{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip{padding:6px 12px;border-radius:999px;border:2px solid var(--later);color:var(--ink);font-weight:700;font-size:16px;animation:land .3s ease-out}
@keyframes land{from{transform:translateY(-14px) scale(.7);opacity:0}}
.foot{min-height:76px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
.listen{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);min-height:26px;font-size:15px}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--hot);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(.75)}}
.pair{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.big{padding:20px 10px;border-radius:20px;font-size:21px;font-weight:900}
.yes{background:var(--cool);color:#04302a;box-shadow:0 5px 0 #159a86}
.no{background:rgba(255,255,255,.08);border:2px solid var(--later)}
.next{background:var(--fire);color:#2a1500;font-weight:900;font-size:26px;padding:16px;border-radius:999px;box-shadow:0 6px 0 #b96f00;width:100%}
.again{padding:8px;font-weight:700;color:var(--muted);font-size:15px}
.ghost{background:rgba(255,255,255,.1);padding:13px 16px;border-radius:14px;font-weight:700;width:100%}

/* summary and grown-ups */
.sum{align-items:center;text-align:center;justify-content:center;gap:18px}
.sum h1{font-size:40px;font-weight:900;margin:0;text-transform:uppercase}
.sum h1 b{color:var(--fire)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.trio div{background:rgba(255,255,255,.08);border-radius:16px;padding:12px 6px}
.trio b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.trio span{font-size:13px;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:6;background:rgba(5,10,24,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet > div{background:var(--sky);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text}
.sheet h2{margin:0;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sheet h1{margin:0;font-size:24px}
.sheet p{margin:0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%} .bar .locked{background:var(--fire)} .bar .burned{background:var(--cool)} .bar .side{background:var(--later)}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.danger{color:var(--hot);border:2px solid var(--hot);padding:12px;border-radius:12px;font-weight:800}
a{color:var(--cool)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app"></div>
<script type="module" src="game.js"></script>
</body>
</html>
