<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Burn mic test</title>
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Burn">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#13233b">
<style>
:root{--board:#13233b;--panel:#1c3252;--line:#2e4870;--ink:#eef3fb;--muted:#9db0cf;--card:#fff7e3;--card-ink:#14233b;--bolt:#ffc933;--clear:#2fd4b8;--miss:#ff8a7c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{min-height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0;line-height:1.15}
h2{font-size:14px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.go{background:var(--bolt);color:#1b1500;font-weight:800;font-size:22px;padding:18px;border-radius:18px;width:100%}
.ghost{background:var(--panel);padding:13px 14px;border-radius:12px;font-weight:600;width:100%}
.card{background:var(--card);color:var(--card-ink);border-radius:22px;min-height:190px;display:grid;place-items:center;padding:20px 12px}
#word{font-weight:700;letter-spacing:.03em;white-space:nowrap;line-height:1.1}
.dot{display:block;width:16px;height:16px;border-radius:50%;background:#c9bf9f}
.meter{height:12px;border-radius:6px;background:var(--panel);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;background:var(--clear)}
.meter b{position:absolute;top:0;bottom:0;width:2px;background:var(--bolt)}
.fb{min-height:54px;text-align:center;font-size:20px;font-weight:700}
.fb span{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.box{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:13px}
td.n,th.n{text-align:right}
.ok{color:var(--clear)} .bad{color:var(--miss)} .warn{color:var(--bolt)}
label.tick{display:flex;gap:10px;align-items:flex-start}
label.tick input{width:22px;height:22px;margin-top:1px;flex:none}
pre{white-space:pre-wrap;word-break:break-word;font-size:12.5px;margin:0;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* Word Burn mic test. One question: on this phone, launched this way, can the page hear the moment
   someone starts saying a word? Nothing is uploaded or stored; recordings stay in the page's memory
   and vanish when it closes. */

const WORDS = ["the","said","because","through","people","thought","enough","island","answer","friends","could","different","straight","favourite","knowledge","once","their","question","busy","special"];
const POLL_MS = 10;          // how often the volume is sampled
const MIN_ONSET_MS = 120;    // sound earlier than this after the word appears is noise, not a reply
const HOLD_MS = 30;          // sound must stay above the upper line this long to count as a start
const QUIET_MS = 450;        // this much quiet ends the reply
const GIVE_UP_MS = 6000;

const app = document.getElementById("app");
function h(tag, a, ...kids) {
  const e = document.createElement(tag);
  if (a) for (const k in a) { const v = a[k]; if (v == null || v === false) continue; if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v); }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function put(...kids) { app.textContent = ""; for (const k of kids.flat()) if (k != null && k !== false) app.append(k); }
const standalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VERSION = "v3";
const scale = v => Math.min(100, Math.sqrt(v) * 300);   // volume bar: square-root scale so quiet speech is visible
const secs = ms => (ms / 1000).toFixed(2) + "s";
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* ---------- microphone ---------- */
let stream = null, actx = null, analyser = null, buf = null, recType = "", micInfo = {};
async function openMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("This browser gives the page no microphone at all."), {name: "NoMediaDevices"});
  stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: true, autoGainControl: false}});
  actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") await actx.resume();
  const src = actx.createMediaStreamSource(stream);
  analyser = actx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0;
  src.connect(analyser); buf = new Float32Array(analyser.fftSize);
  if (window.MediaRecorder) recType = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"].find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } }) || "";
  const tr = stream.getAudioTracks()[0], st = tr && tr.getSettings ? tr.getSettings() : {};
  micInfo = {label: tr ? tr.label : "", rate: actx.sampleRate, channels: st.channelCount || "", recorder: window.MediaRecorder ? (recType || "default") : "none"};
}
function closeMic() { try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {} try { actx && actx.close(); } catch (e) {} stream = actx = analyser = null; }
function level() { if (!analyser) return 0; analyser.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }

/* ---------- one word ---------- */
let run = null, timer = 0, preTimer = 0, quietest = Infinity;
function listenFor(word) {
  return new Promise(resolve => {
    const wordEl = document.getElementById("word"), card = wordEl.parentNode, bar = document.getElementById("lvl"), mark = document.getElementById("mark");
    wordEl.className = "dot"; wordEl.textContent = ""; wordEl.style.fontSize = "";
    // 1. measure the room with nothing on screen, and wait for quiet before showing the word
    const quiet = []; const qStart = performance.now();
    const pre = preTimer = setInterval(() => {
      quiet.push(level()); if (quiet.length > 30) quiet.shift();          // keep the last 300 ms
      const waited = performance.now() - qStart;
      if (waited < 500) return;
      const m = median(quiet); if (m < quietest) quietest = m;             // the quietest this room has been so far
      if (Math.max(...quiet) > Math.max(quietest * 6, 0.003) && waited < 3000) return;   // someone is still talking: wait
      clearInterval(pre);
      // Two lines. A reply is confirmed when the volume holds above the upper one, and it is timed from where
      // it first crossed the lower one, so a soft first sound still counts as the start.
      const floor = Math.min(m, Math.max(quietest, 0.00005) * 3), low = Math.min(0.04, Math.max(floor * 5, 0.0015)), line = Math.min(0.08, Math.max(floor * 12, 0.004));
      mark.style.left = scale(line) + "%";
      // 2. start a recording, show the word, start the clock when it is actually painted
      let rec = null, chunks = [];
      try { if (window.MediaRecorder) { rec = new MediaRecorder(stream, recType ? {mimeType: recType} : undefined); rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); }; rec.start(); } } catch (e) { rec = null; }
      let sr = null, srText = "", srErr = "";
      if (run.dictation && SR) { try { sr = new SR(); sr.lang = "en-GB"; sr.interimResults = true; sr.maxAlternatives = 3; sr.onresult = e => { srText = Array.from(e.results).map(r => r[0].transcript).join(" ").trim(); }; sr.onerror = e => { srErr = e.error || "error"; }; sr.start(); } catch (e) { srErr = String(e.name || e); sr = null; } }
      wordEl.className = ""; wordEl.textContent = word;
      wordEl.style.fontSize = Math.max(28, Math.min(104, (card.clientWidth - 32) / (Math.max(3, word.length) * .6))) + "px";
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const t0 = performance.now(); let segStart = 0, highSince = 0, onset = null, lastLoud = 0, peak = 0, bursts = 0, inBurst = false;
        timer = setInterval(() => {
          const now = performance.now(), t = now - t0, v = level();
          bar.style.width = scale(v) + "%";
          const live = t > MIN_ONSET_MS;
          if (live && v > low) {
            if (!segStart) segStart = now;
            if (v > line) { if (!highSince) highSince = now; if (onset == null && now - highSince >= HOLD_MS) onset = segStart - t0; } else highSince = 0;
            if (onset != null) { lastLoud = now; if (!inBurst) { inBurst = true; bursts++; } }
            if (v > peak) peak = v;
          } else {
            highSince = 0;
            if (onset == null) segStart = 0;
            if (inBurst && now - lastLoud > 150) inBurst = false;
          }
          const done = onset != null && now - lastLoud > QUIET_MS, gaveUp = onset == null && t > GIVE_UP_MS;
          if (!done && !gaveUp) return;
          clearInterval(timer); bar.style.width = "0%";
          const out = {word, onset, length: onset == null ? null : lastLoud - t0 - onset, bursts, floor, low, line, peak, clip: null, heard: "", srErr: ""};
          let settled = false;
          const finish = () => { if (settled) return; settled = true; out.heard = srText; out.srErr = srErr; resolve(out); };
          const stopRec = () => {
            if (!rec || rec.state === "inactive") return finish();
            rec.onstop = () => { try { if (chunks.length) out.clip = URL.createObjectURL(new Blob(chunks, {type: rec.mimeType || recType || "audio/mp4"})); } catch (e) {} finish(); };
            try { rec.stop(); } catch (e) { finish(); }
            setTimeout(finish, 1000);   // some browsers never report the recording as stopped
          };
          if (sr) { let ended = false; const end = () => { if (ended) return; ended = true; stopRec(); }; sr.onend = end; try { sr.stop(); } catch (e) {} setTimeout(end, 1500); } else stopRec();
        }, POLL_MS);
      }));
    }, POLL_MS);
  });
}
function verdict(r) {
  if (r.onset == null) return ["bad", "Nothing heard"];
  if (r.bursts > 1 || r.length > 1400) return ["warn", "Heard, but stretched or in pieces"];
  return ["ok", "Clean"];
}

/* ---------- keeping and copying results ---------- */
function saveReport(text) { try { localStorage.setItem("wb.last", text); } catch (e) {} }
function lastReport() { try { return localStorage.getItem("wb.last") || ""; } catch (e) { return ""; } }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied. Paste it to Claude."; }
  catch (e) { btn.textContent = "Could not copy. Screenshot the details below instead."; }
}

/* ---------- dictation-only test: does the phone's own dictation name the word? ---------- */
function startDictation() {
  let rec; try { rec = new SR(); } catch (e) { return home("Dictation could not start: " + (e.name || e)); }
  rec.lang = "en-GB"; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 3;
  const D = {started: Date.now(), rows: [], i: -1, errors: [], ends: 0, shownAt: 0, cur: null, done: false, timer: 0};
  put(
    h("p", {class: "muted small", id: "count"}, "Starting dictation…"),
    h("div", {class: "card"}, h("span", {id: "word", class: "dot"})),
    h("div", {class: "fb", id: "fb", "aria-live": "polite"}, "Allow speech recognition if asked"),
    h("button", {class: "ghost", onclick: () => endDictationNow && endDictationNow()}, "Stop and show results"));
  const wordEl = document.getElementById("word"), card = wordEl.parentNode;
  function next() {
    clearTimeout(D.timer); if (D.done) return;
    if (D.cur) { D.rows.push(D.cur); D.cur = null; }
    const last3 = D.rows.slice(-3);
    if (last3.length === 3 && last3.every(r => !r.heard)) { D.errors.push("gave up: nothing heard for three words in a row"); return endDictation(); }
    D.i++; if (D.i >= WORDS.length) return endDictation();
    const word = WORDS[D.i];
    D.cur = {word, heard: "", alts: [], firstMs: null, final: false};
    document.getElementById("count").textContent = "Word " + (D.i + 1) + " of " + WORDS.length;
    wordEl.className = ""; wordEl.textContent = word;
    wordEl.style.fontSize = Math.max(28, Math.min(104, (card.clientWidth - 32) / (Math.max(3, word.length) * .6))) + "px";
    D.shownAt = performance.now();
    D.timer = setTimeout(next, 6000);
  }
  function endDictation() {
    if (D.done) return; D.done = true; clearTimeout(D.timer);
    if (D.cur) { D.rows.push(D.cur); D.cur = null; }
    try { rec.onend = null; rec.stop(); } catch (e) {}
    dictationResults(D);
  }
  rec.onstart = () => { if (D.i < 0) next(); };
  rec.onresult = e => {
    if (!D.cur || D.done) return;
    if (performance.now() - D.shownAt < 150) return;                 // leftovers from the word before
    const r = e.results[e.results.length - 1]; if (!r) return;
    const text = r[0].transcript.trim(); if (!text) return;
    if (D.cur.firstMs == null) D.cur.firstMs = performance.now() - D.shownAt;
    D.cur.heard = text; D.cur.alts = Array.from(r).map(a => a.transcript.trim());
    const fb = document.getElementById("fb"); if (fb) { fb.className = "fb"; fb.textContent = "Heard: " + text; }
    if (r.isFinal) { D.cur.final = true; clearTimeout(D.timer); D.timer = setTimeout(next, 700); }
  };
  rec.onerror = e => { D.errors.push((e.error || "error") + " at word " + (D.i + 1)); };
  rec.onend = () => { D.ends++; if (D.done) return; try { rec.start(); } catch (e) { D.errors.push("could not restart: " + (e.name || e)); endDictation(); } };
  try { rec.start(); } catch (e) { return home("Dictation could not start: " + (e.name || e)); }
  setTimeout(() => { if (D.i < 0 && !D.done) { D.errors.push("never started"); endDictation(); } }, 8000);
  endDictationNow = endDictation;
}
let endDictationNow = null;
const spoken = t => t.toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/).filter(Boolean);
const US = {favourite: "favorite"};
function dictationResults(D) {
  const n = D.rows.length, hit = r => [r.heard, ...r.alts].some(t => { const w = spoken(t); return w.includes(r.word) || w.includes(US[r.word] || r.word); });
  const got = D.rows.filter(r => r.heard), right = D.rows.filter(hit), times = got.map(r => r.firstMs);
  const report = [
    "Word Burn dictation test " + VERSION, new Date(D.started).toISOString(),
    "opened as: " + (standalone() ? "home-screen app" : "browser tab"),
    "words shown: " + n + ", something heard: " + got.length + ", right word: " + right.length,
    "median time to first text: " + (times.length ? secs(median(times)) : "n/a"),
    "session ended and restarted: " + D.ends + " times", "errors: " + (D.errors.join("; ") || "none"),
    "device: " + navigator.userAgent,
    ...D.rows.map(r => r.word + " | heard: " + (r.heard || "-") + (r.alts.length > 1 ? " [also: " + r.alts.slice(1).join(", ") + "]" : "") + " | " + (r.firstMs == null ? "no text" : Math.round(r.firstMs) + "ms to first text") + (r.final ? "" : " (not settled)") + " | " + (hit(r) ? "RIGHT" : "wrong")),
  ].join("\n");
  saveReport(report);
  put(
    h("h1", null, n ? "Dictation got " + right.length + " of " + n : "Dictation did not run"),
    h("div", {class: "box"},
      h("p", null, "Opened as: ", h("b", null, standalone() ? "a home-screen app" : "a browser tab")),
      h("p", null, "Heard something for ", h("b", null, got.length + " of " + n), ", the right word for ", h("b", {class: right.length >= n * .9 && n ? "ok" : "bad"}, right.length + " of " + n), "."),
      D.errors.length ? h("p", {class: "bad small"}, "Errors: " + D.errors.join("; ")) : null),
    h("button", {class: "ghost", onclick: e => copy(report, e.currentTarget)}, "Copy results for Claude"),
    h("button", {class: "go", onclick: () => home()}, "Back"),
    h("h2", null, "Each word"),
    h("table", null,
      h("tr", null, h("th", null, "Word"), h("th", null, "Heard"), h("th", null, "")),
      D.rows.map(r => h("tr", null, h("td", null, r.word), h("td", null, r.heard || "–"), h("td", {class: (hit(r) ? "ok" : "bad") + " small"}, hit(r) ? "Right" : "Wrong")))),
    h("h2", null, "Details"), h("pre", null, report));
}

/* ---------- screens ---------- */
function home(err) {
  put(
    h("h1", null, "Word Burn mic test ", h("span", {class: "muted small"}, VERSION)),
    h("p", null, "This checks one thing: whether this phone, opened this way, can hear the instant you start saying a word."),
    h("div", {class: "box"},
      h("p", null, "Opened as: ", h("b", {class: standalone() ? "ok" : "warn"}, standalone() ? "a home-screen app" : "a browser tab")),
      standalone() ? null : h("p", {class: "muted small"}, "Run it once here. Then tap Share, Add to Home Screen, open it from the new icon and run it again. That second run is the one that matters.")),
    err ? h("div", {class: "box"}, h("p", {class: "bad"}, "The microphone did not open."), h("p", {class: "small"}, err), h("p", {class: "muted small"}, "If you tapped Don't Allow: Settings, Apps, Safari, Microphone, set it to Ask or Allow, then try again.")) : null,
    h("p", {class: "small muted"}, "20 words appear one at a time. Say each one out loud as soon as you see it. It moves on by itself. Hold the phone about a forearm away."),
    h("button", {class: "go", onclick: start}, "Start timing test"),
    SR ? h("button", {class: "ghost", onclick: startDictation}, "Start dictation test") : h("p", {class: "small muted"}, "The phone's own dictation is not offered to this page, so only timing can be tested."),
    SR ? h("p", {class: "small muted"}, "The dictation test is separate. It asks the phone's own dictation which word you said, and does no timing.") : null,
    lastReport() ? h("button", {class: "ghost", onclick: e => copy(lastReport(), e.currentTarget)}, "Copy the last results again") : null,
    h("p", {class: "small muted"}, "Nothing is sent anywhere. Recordings stay on this phone and disappear when you close the page."));
}
async function start() {
  const dictation = false;   // dictation has its own test: running both at once can cut the microphone off
  try { await openMic(); } catch (e) { closeMic(); return home((e && e.name ? e.name + ": " : "") + (e && e.message ? e.message : String(e))); }
  quietest = Infinity;
  run = {dictation, results: [], started: Date.now()};
  put(
    h("p", {class: "muted small", id: "count"}, ""),
    h("div", {class: "card"}, h("span", {id: "word", class: "dot"})),
    h("div", {class: "meter"}, h("i", {id: "lvl"}), h("b", {id: "mark"})),
    h("div", {class: "fb", id: "fb", "aria-live": "polite"}, "Get ready"),
    h("button", {class: "ghost", onclick: () => { clearInterval(timer); clearInterval(preTimer); finish(); }}, "Stop and show results"));
  await new Promise(r => setTimeout(r, 900));
  for (let i = 0; i < WORDS.length && run; i++) {
    document.getElementById("count").textContent = "Word " + (i + 1) + " of " + WORDS.length;
    const r = await listenFor(WORDS[i]); if (!run) return;
    run.results.push(r);
    const fb = document.getElementById("fb"); if (!fb) return;
    const [cls, text] = verdict(r); fb.className = "fb " + cls;
    fb.textContent = r.onset == null ? "Nothing heard" : "Started after " + secs(r.onset);
    fb.append(h("span", null, r.onset == null ? "Volume never held above the yellow line." : text + ", " + secs(r.length) + " long" + (run.dictation ? (r.heard ? ". Dictation heard: " + r.heard : ". Dictation heard nothing" + (r.srErr ? " (" + r.srErr + ")" : "")) : "")));
    await new Promise(res => setTimeout(res, 1100));
  }
  finish();
}
function finish() {
  if (!run) return; const R = run; run = null; closeMic();
  const got = R.results.filter(r => r.onset != null), clean = got.filter(r => verdict(r)[0] === "ok");
  const med = median(got.map(r => r.onset)), n = R.results.length;
  const matched = R.dictation ? R.results.filter(r => r.heard && r.heard.toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/).includes(r.word)).length : null;
  const report = [
    "Word Burn mic test " + VERSION, new Date(R.started).toISOString(),
    "opened as: " + (standalone() ? "home-screen app" : "browser tab"),
    "words shown: " + n + ", heard: " + got.length + ", clean: " + clean.length,
    "median start: " + (got.length ? secs(med) : "n/a"),
    R.dictation ? "dictation matched: " + matched + " of " + n : "dictation: not tried" + (SR ? "" : " (not offered)"),
    "mic: " + (micInfo.label || "?") + ", " + micInfo.rate + " Hz, recorder " + micInfo.recorder,
    "device: " + navigator.userAgent,
    ...R.results.map(r => r.word + " | " + (r.onset == null ? "none" : Math.round(r.onset) + "ms start, " + Math.round(r.length) + "ms long, " + r.bursts + " burst") + " | room " + r.floor.toFixed(4) + " lines " + r.low.toFixed(4) + "/" + r.line.toFixed(4) + " peak " + r.peak.toFixed(3) + (R.dictation ? " | heard: " + (r.heard || "-") + (r.srErr ? " (" + r.srErr + ")" : "") : "")),
  ].join("\n");
  const good = n >= 5 && got.length >= n * .9;
  const player = new Audio();
  saveReport(report);
  const copyBtn = h("button", {class: "ghost", onclick: e => copy(report, e.currentTarget)}, "Copy results for Claude");
  put(
    h("h1", null, n ? (good ? "It can hear you" : got.length ? "It heard some of them" : "It heard nothing") : "No words tried"),
    h("div", {class: "box"},
      h("p", null, "Opened as: ", h("b", null, standalone() ? "a home-screen app" : "a browser tab")),
      h("p", null, "Heard ", h("b", {class: good ? "ok" : "bad"}, got.length + " of " + n), ", ", clean.length + " of them clean."),
      got.length ? h("p", null, "Typical start: ", h("b", null, secs(med)), " after the word appeared.") : null,
      R.dictation ? h("p", null, "Phone dictation got the right word ", h("b", null, matched + " of " + n), " times.") : null),
    copyBtn,
    h("button", {class: "go", onclick: () => home()}, "Run it again"),
    h("h2", null, "Each word"),
    h("table", null,
      h("tr", null, h("th", null, "Word"), h("th", {class: "n"}, "Start"), h("th", {class: "n"}, "Length"), h("th", null, ""), h("th", null, "")),
      R.results.map(r => { const [cls, text] = verdict(r);
        return h("tr", null, h("td", null, r.word), h("td", {class: "n"}, r.onset == null ? "–" : secs(r.onset)), h("td", {class: "n"}, r.onset == null ? "–" : secs(r.length)),
          h("td", {class: cls + " small"}, text + (R.dictation && r.heard ? " (" + r.heard + ")" : "")),
          h("td", null, r.clip ? h("button", {class: "small", style: "background:none;text-decoration:underline;padding:0", onclick: () => { player.src = r.clip; player.play().catch(() => {}); }}, "Play") : "")); })),
    h("p", {class: "small muted"}, "Start is the gap between the word appearing and your voice. Tap Play to check the recording caught the whole word."),
    h("h2", null, "Details"), h("pre", null, report));
}
home();
</script>
